events {}

http {
    map $uri $qr_id {
        ~^/r/([^/]+) $1;
        default "";
    }
    
    // rate limiting per zone and per qr code
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $qr_id zone=qr:10m rate=100r/s;
    
    server {
        listen 80;
        server_name qrifier.tech www.qrifier.tech;
        
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name qrifier.tech www.qrifier.tech;

        ssl_certificate /etc/letsencrypt/live/qrifier.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/qrifier.tech/privkey.pem;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            
            if ($host !~* ^(qrifier\.tech|www\.qrifier\.tech)$) {
                return 403;
            }
            
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /r/ {
            limit_req zone=qr burst=200 nodelay;
            
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            
            proxy_pass http://backend:8080/r/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}